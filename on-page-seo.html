<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>On-Page SEO Lab | Interactive Learning</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#e8edf8;background:#0b1020}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}header{padding:22px 5%;border-bottom:1px solid #28344e;display:flex;align-items:center;justify-content:space-between;gap:15px}h1{font-size:1.5rem;margin:0}h2{margin:0 0 12px;font-size:1.35rem}h3{margin:0 0 10px}p{line-height:1.6;color:#b7c4db}.muted{color:#9aa9c2;font-size:.9rem}.pill{background:#163a38;color:#78e9c6;border-radius:30px;padding:7px 12px;font-size:.85rem}.shell{max-width:1300px;margin:auto;padding:25px 5%;display:grid;grid-template-columns:230px minmax(0,1fr);gap:25px}.nav{display:flex;flex-direction:column;gap:8px}.nav button{background:transparent;color:#aebcd4;border:1px solid transparent;text-align:left;padding:13px;border-radius:12px}.nav button.active{background:#1c2c4c;color:#fff;border-color:#3e6bb3}.panel{background:#141d31;border:1px solid #2c3952;border-radius:16px;padding:23px;margin-bottom:18px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-size:.88rem;color:#c4d0e4;margin:14px 0 7px}input,textarea,select{width:100%;background:#0c1527;border:1px solid #42506a;color:#fff;padding:12px;border-radius:9px;outline:none}textarea{min-height:110px;resize:vertical}input:focus,textarea:focus{border-color:#65a6ff}button.primary{background:#5b91f5;border:0;color:#08152d;padding:11px 17px;border-radius:10px;font-weight:700}button.secondary{background:#263550;color:#e7eefc;border:1px solid #435475;padding:10px 15px;border-radius:10px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.search-result{background:#fff;color:#333;border-radius:12px;padding:22px;max-width:650px}.search-result .url{color:#333;font-size:.85rem;overflow-wrap:anywhere}.search-result .title{color:#1a0dab;font-size:1.3rem;margin:8px 0;overflow-wrap:anywhere}.search-result .desc{color:#4d5156;font-size:.9rem;line-height:1.55}.feedback{background:#0c172a;border-left:3px solid #6a9eff;padding:13px 16px;border-radius:7px;margin-top:15px;color:#c9d8f0}.good{border-left-color:#45d4a2}.bad{border-left-color:#ffab72}.meter{height:9px;background:#29364f;border-radius:10px;overflow:hidden;margin:10px 0}.meter span{display:block;background:#66cbb4;height:100%;transition:width .2s}.small{font-size:.83rem;color:#9daec9}.hide{display:none}.question{margin:18px 0;padding:16px;background:#0d172a;border-radius:12px}.question label{margin:9px 0;display:flex;gap:10px;align-items:center;cursor:pointer}.question input{width:auto}.checklist label{display:flex;align-items:center;gap:10px;margin:12px 0}.checklist input{width:auto}.code{font-family:ui-monospace,Consolas,monospace}.stat{font-size:1.7rem;font-weight:800;color:#7ec9ff}.lesson-tag{color:#7fe6c8;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.example{background:#0a1427;border-radius:10px;padding:14px;color:#a8d4ff;font-family:monospace;white-space:pre-wrap;overflow-wrap:anywhere}.tip{border-left:3px solid #e7b968;padding-left:12px}.footer{color:#8d9bb6;text-align:center;padding:25px}@media(max-width:800px){.shell{display:block}.nav{flex-direction:row;overflow-x:auto;margin-bottom:20px}.nav button{white-space:nowrap}.two{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.panel{padding:17px}}
</style>
</head>
<body>
<header><div><h1>🔎 On-Page SEO Lab</h1><div class="muted">Learn → experiment → audit → test yourself</div></div><span class="pill" id="progress">0 / 6 modules completed</span></header>
<div class="shell"><aside><nav class="nav" id="nav"></nav></aside><main id="main"></main></div>
<footer class="footer">Built for learning. Checks are heuristics, not Google ranking scores. All progress is saved in this browser.</footer>
<script>
const modules=[['start','Start here'],['serp','Title & meta'],['headings','Headings'],['intent','Search intent'],['content','Content & links'],['audit','SEO audit'],['quiz','Final quiz']];
const defaults={title:'Dental Implants in Delhi | Example Clinic',description:'Learn about dental implant treatment options, recovery, costs and consultations at our Delhi clinic.',url:'https://example.com/dental-implants',keyword:'dental implants in delhi',headings:'<h1>Dental Implants in Delhi</h1>\n<h2>What are dental implants?</h2>\n<h2>Types of implants</h2>\n<h3>Single tooth implants</h3>\n<h2>Costs and recovery</h2>',content:'Dental implants in Delhi can help replace missing teeth. This guide explains the treatment process, expected recovery and factors that affect cost.\n\nBefore deciding on treatment, speak with a qualified dentist about your individual needs.',links:'<a href="/treatments">Explore dental treatments</a>\n<a href="/contact">Book a consultation</a>',alt:'Dental implant model showing a crown and titanium screw'};
let data={...defaults,...JSON.parse(localStorage.getItem('seoLabData')||'{}')};let completed=JSON.parse(localStorage.getItem('seoLabCompleted')||'[]');let active='start';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('seoLabData',JSON.stringify(data));localStorage.setItem('seoLabCompleted',JSON.stringify(completed))}
function nav(){document.getElementById('nav').innerHTML=modules.map(([id,label],i)=>`<button class="${active===id?'active':''}" data-nav="${id}">${completed.includes(id)?'✓ ':''}${i+1}. ${label}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>show(b.dataset.nav));document.getElementById('progress').textContent=`${completed.length} / 6 modules completed`}
function complete(id){if(!completed.includes(id)){completed.push(id);save();nav()}show(id)}
function field(key,label,tag='input'){return `<label for="${key}">${label}</label>${tag==='textarea'?`<textarea id="${key}" data-field="${key}">${esc(data[key])}</textarea>`:`<input id="${key}" data-field="${key}" value="${esc(data[key])}">`}`}
function finish(id){return `<div class="actions"><button class="primary" id="complete">Mark lesson complete ✓</button></div>`}
function show(id){active=id;nav();const root=document.getElementById('main');root.innerHTML=pages[id]();root.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',e=>{data[e.target.dataset.field]=e.target.value;save();refresh()}));if(document.getElementById('complete'))document.getElementById('complete').onclick=()=>complete(id);if(document.getElementById('next'))document.getElementById('next').onclick=()=>show('serp');if(document.getElementById('reset'))document.getElementById('reset').onclick=()=>{if(confirm('Reset all lesson progress and fields?')){data={...defaults};completed=[];save();show('start')}};if(document.getElementById('grade'))document.getElementById('grade').onclick=gradeQuiz;if(document.getElementById('analyze'))document.getElementById('analyze').onclick=analyzeAudit;refresh()}
const pages={
start:()=>`<div class="panel"><div class="lesson-tag">Welcome</div><h2>Become better at on-page SEO by doing it</h2><p>Work through six practical modules. You will edit real HTML concepts, see live feedback, and build an audit you can copy into a client report.</p><div class="two"><div class="panel"><div class="stat">6</div><b>Hands-on modules</b><p>Title tags, headings, search intent, content, links, auditing, and testing.</p></div><div class="panel"><div class="stat">100%</div><b>Runs locally</b><p>No login, backend, API key, or framework. Your edits are saved in localStorage.</p></div></div><p class="tip">Important: Keyword density, title length and checklist scores are not direct Google ranking formulas. They are teaching aids.</p><div class="actions"><button class="primary" id="next">Start learning →</button><button class="secondary" id="reset">Reset progress</button></div></div>`,
serp:()=>`<div class="panel"><div class="lesson-tag">Lesson 1</div><h2>Title tags & meta descriptions</h2><p>A descriptive title helps explain the page. A meta description may be used as a search snippet, but Google can rewrite both. Aim for clarity and relevance, not a magic character count.</p><div class="two"><div>${field('title','SEO title')}${field('description','Meta description','textarea')}${field('url','Page URL')}</div><div><h3>Live search result preview</h3><div class="search-result"><div class="url" id="previewUrl"></div><div class="title" id="previewTitle"></div><div class="desc" id="previewDesc"></div></div><div id="serpFeedback" class="feedback"></div></div></div>${finish('serp')}</div>`,
headings:()=>`<div class="panel"><div class="lesson-tag">Lesson 2</div><h2>HTML heading structure</h2><p>Use headings to organize topics, not just to change font size. One clear H1 is a useful convention, but multiple H1s are not automatically a Google penalty.</p>${field('headings','Edit heading HTML','textarea')}<div class="two"><div class="panel"><h3>Detected outline</h3><div id="headingOutline"></div></div><div class="panel"><h3>Heading analysis</h3><div id="headingFeedback"></div></div></div>${finish('headings')}</div>`,
intent:()=>`<div class="panel"><div class="lesson-tag">Lesson 3</div><h2>Search intent</h2><p>Before optimizing a page, identify what the searcher actually wants. Pick the best page for each query.</p><div class="question"><b>1. “how do dental implants work”</b>${choice('intent1',['Appointment booking page','Step-by-step educational guide','Clinic contact page'])}</div><div class="question"><b>2. “dental implants cost in delhi”</b>${choice('intent2',['Pricing and cost-factor explanation','History of dentistry','Homepage with no pricing'])}</div><div class="question"><b>3. “book dentist appointment delhi”</b>${choice('intent3',['Glossary of dental terms','Booking or appointment page','Generic news article'])}</div><div id="intentFeedback" class="feedback">Select your answers to see explanations.</div>${finish('intent')}</div>`,
content:()=>`<div class="panel"><div class="lesson-tag">Lesson 4</div><h2>Content, keyword relevance & internal links</h2><p>Write helpful content that matches intent. Include your target phrase naturally when appropriate, and link to relevant pages using descriptive anchor text. Do not chase an arbitrary keyword density.</p>${field('keyword','Primary topic / target phrase')}${field('content','Page body content','textarea')}${field('links','Internal link HTML','textarea')}${field('alt','Image alt text')}<div class="two"><div class="panel"><h3>Content observations</h3><div id="contentFeedback"></div></div><div class="panel"><h3>Link analysis</h3><div id="linkFeedback"></div></div></div>${finish('content')}</div>`,
audit:()=>`<div class="panel"><div class="lesson-tag">Lesson 5</div><h2>Build an on-page SEO audit</h2><p>Use the values you created in previous lessons. The report identifies potential improvements, not a Google ranking prediction.</p><div class="actions"><button class="primary" id="analyze">Run educational audit</button><button class="secondary" id="copyAudit">Copy audit report</button></div><div id="auditResult" class="feedback">Click “Run educational audit” to inspect your page.</div>${finish('audit')}</div>`,
quiz:()=>`<div class="panel"><div class="lesson-tag">Lesson 6</div><h2>Final knowledge check</h2><p>Answer all five questions. A score of at least 4/5 completes the course.</p>${quizQuestions.map((q,i)=>`<div class="question"><b>${i+1}. ${esc(q.q)}</b>${choice('q'+i,q.opts)}</div>`).join('')}<button class="primary" id="grade">Grade my answers</button><div id="quizFeedback" class="feedback">Your results will appear here.</div></div>`};
function choice(name,opts){return opts.map((o,i)=>`<label><input type="radio" name="${name}" value="${i}"> ${esc(o)}</label>`).join('')}
const quizQuestions=[{q:'Is a meta description a direct Google ranking factor?',opts:['Yes','No','Only on mobile'],correct:1,why:'Meta descriptions may influence snippets and clicks, but are not a direct ranking factor.'},{q:'What is the main purpose of an H2?',opts:['To structure a subsection','To repeat the keyword','To increase font size'],correct:0,why:'Headings communicate the structure of content.'},{q:'Which anchor text is most descriptive?',opts:['Click here','Read more','Dental implant treatment options'],correct:2,why:'Anchor text should describe the destination naturally.'},{q:'What should guide your content first?',opts:['A fixed keyword density','Search intent and user needs','Repeating the title 10 times'],correct:1,why:'Useful content should match the searcher’s needs.'},{q:'Does adding schema guarantee rich results?',opts:['Yes','No','Only if the page has an H1'],correct:1,why:'Structured data eligibility does not guarantee rich results.'}];
function refresh(){if(active==='serp'){document.getElementById('previewUrl').textContent=data.url;document.getElementById('previewTitle').textContent=data.title||'Untitled page';document.getElementById('previewDesc').textContent=data.description||'No description provided';let notes=[`Title: ${data.title.length} characters. Description: ${data.description.length} characters.`];if(!data.title.trim())notes.push('Add a descriptive title.');else if(data.title.length>60)notes.push('Consider a shorter title for readability; 60 characters is not a Google limit.');if(!data.description.trim())notes.push('Add a useful summary.');else if(data.description.length>160)notes.push('Consider a more concise description; Google uses variable snippet lengths.');document.getElementById('serpFeedback').textContent=notes.join(' ')}
if(active==='headings'){const doc=new DOMParser().parseFromString(data.headings,'text/html');const hs=[...doc.querySelectorAll('h1,h2,h3,h4,h5,h6')];document.getElementById('headingOutline').innerHTML=hs.length?hs.map(h=>`<div style="margin:9px 0 9px ${(Number(h.tagName[1])-1)*15}px"><b>${h.tagName}</b> ${esc(h.textContent.trim()||'(empty)')}</div>`).join(''):'No heading elements detected.';let notes=[];const h1=hs.filter(h=>h.tagName==='H1');notes.push(`${h1.length} H1 heading(s) found.`);if(h1.length===0)notes.push('Add a clear primary heading.');if(h1.length>1)notes.push('Multiple H1s are allowed, but check whether the page has one obvious main topic.');if(hs.some(h=>!h.textContent.trim()))notes.push('Some headings are empty.');if(hs.some((h,i)=>i>0&&Number(h.tagName[1])>Number(hs[i-1].tagName[1])+1))notes.push('Heading levels jump; consider a clearer hierarchy.');document.getElementById('headingFeedback').textContent=notes.join(' ')}
if(active==='intent'){const answers=[1,0,1];let chosen=answers.map((a,i)=>document.querySelector(`input[name="intent${i+1}"]:checked`)?.value);document.getElementById('intentFeedback').textContent=`${chosen.filter((v,i)=>v!==undefined&&Number(v)===answers[i]).length}/3 correct. ${chosen.every(v=>v!==undefined)?'Informational queries need explanations, pricing queries need cost information, and booking queries need an easy way to book.':'Complete all three choices.'}`;document.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=refresh)}
if(active==='content'){const words=data.content.trim().split(/\s+/).filter(Boolean);const count=words.length;const phrase=data.keyword.trim().toLowerCase();const contains=phrase&&data.content.toLowerCase().includes(phrase);document.getElementById('contentFeedback').textContent=`${count} words. ${contains?'Target phrase appears in the content.':'Target phrase not found exactly; synonyms and related wording can still be appropriate.'} Focus on accuracy, completeness, and search intent rather than a minimum word count.`;const doc=new DOMParser().parseFromString(data.links,'text/html');const anchors=[...doc.querySelectorAll('a')];const weak=anchors.filter(a=>/^(click here|read more|here)$/i.test(a.textContent.trim()));document.getElementById('linkFeedback').textContent=`${anchors.length} link(s) found. ${weak.length} generic anchor(s). ${data.alt.trim()?'Image alt text provided.':'No alt text provided; decorative images can intentionally use empty alt text.'}`}
}
let lastAudit='';function analyzeAudit(){const issues=[];const good=[];if(!data.title.trim())issues.push('Missing title tag');else good.push('Title provided');if(data.title.length>60)issues.push('Review title length for readability (not a ranking limit)');if(!data.description.trim())issues.push('Missing meta description');else good.push('Meta description provided');if(data.description.length>160)issues.push('Review description length (not a ranking limit)');if(!/^https?:\/\//i.test(data.url))issues.push('URL should be a valid absolute HTTP(S) URL for this preview');const doc=new DOMParser().parseFromString(data.headings,'text/html');if(!doc.querySelector('h1'))issues.push('No H1 detected');else good.push('H1 detected');if(!data.content.trim())issues.push('Page body content is empty');else good.push('Page body content provided');const links=[...new DOMParser().parseFromString(data.links,'text/html').querySelectorAll('a')];if(!links.length)issues.push('No internal links in the sample');else good.push(`${links.length} link(s) provided`);lastAudit='ON-PAGE SEO EDUCATIONAL AUDIT\n\nPotential improvements:\n'+(issues.map(x=>'- '+x).join('\n')||'- No basic checklist issues detected')+'\n\nPositive checks:\n'+good.map(x=>'- '+x).join('\n')+'\n\nManual review still required: search intent, originality, accuracy, crawlability, actual internal link destinations, mobile UX, and Search Console data.';document.getElementById('auditResult').innerHTML=`<h3>${issues.length} potential improvement(s)</h3><div class="example">${esc(lastAudit)}</div>`;document.getElementById('copyAudit').onclick=async()=>{try{await navigator.clipboard.writeText(lastAudit);document.getElementById('copyAudit').textContent='Copied!'}catch{const t=document.createElement('textarea');t.value=lastAudit;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();document.getElementById('copyAudit').textContent='Copied!'}}}
function gradeQuiz(){let score=0,missing=0;const notes=[];quizQuestions.forEach((q,i)=>{const checked=document.querySelector(`input[name="q${i}"]:checked`);if(!checked){missing++;return}if(Number(checked.value)===q.correct)score++;else notes.push(`Q${i+1}: ${q.why}`)});const out=document.getElementById('quizFeedback');if(missing){out.textContent=`Answer all questions first. ${missing} remaining.`;return}out.innerHTML=`<b>Score: ${score}/5</b><p>${score>=4?'Passed! You understand the core concepts.':'Review the lessons and try again.'}</p>${notes.map(n=>`<p>${esc(n)}</p>`).join('')}`;if(score>=4&&!completed.includes('quiz')){completed.push('quiz');save();nav()}}
show('start');
</script>
</body></html>
