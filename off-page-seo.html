<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Off-page SEO Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f0;color:#172c28;font:16px/1.6 system-ui,sans-serif}header{background:#153e35;color:white;padding:38px max(5%,calc((100% - 1100px)/2))}h1{font-size:clamp(30px,5vw,48px);line-height:1.1;margin:8px 0}small{letter-spacing:1.5px;text-transform:uppercase;color:#acd6bf}main{max-width:1100px;margin:28px auto;padding:0 20px;display:grid;grid-template-columns:245px 1fr;gap:22px}aside,article{background:white;border:1px solid #d6e2da;border-radius:18px;padding:24px}aside{align-self:start;position:sticky;top:18px}button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid #b7c9bf;background:white;color:#18362d;padding:10px 14px;text-align:left}button:hover{background:#e2f1e8}nav button{display:block;width:100%;margin:8px 0}button.active,.primary{background:#1b654d;color:white;border-color:#1b654d}button:disabled{cursor:default;opacity:.75}.choices{display:grid;gap:10px;margin:18px 0}.correct{border-color:#18834d;background:#def5e5}.wrong{border-color:#bb4646;background:#ffe9e5}.feedback{padding:15px;border-radius:10px;background:#edf3f0;margin:18px 0}.bar{height:9px;background:#dce9e2;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#37a66c}h2{margin:0;font-size:28px;line-height:1.25}.tag{color:#39765d;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:1px}.context{background:#f3f7f5;padding:16px;border-radius:10px;border-left:4px solid #70ab85}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}input,textarea{width:100%;font:inherit;padding:10px;border:1px solid #b7c9bf;border-radius:8px}footer{color:#53685e;font-size:13px;margin-top:18px}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #dbe4de}@media(max-width:720px){main{grid-template-columns:1fr}aside{position:static}nav{display:grid;grid-template-columns:1fr 1fr}article,aside{padding:18px}}
</style><header><small>SEO academy / module 05</small><h1>Off-page SEO practice lab</h1><p>Learn to judge backlinks, build a campaign and measure real business impact.</p></header><main><aside><div class="tag">Your progress</div><h2 id="score"></h2><div class="bar"><i id="progress"></i></div><nav id="nav"></nav><button id="reset">Reset practice</button></aside><article id="lab" aria-live="polite"></article></main><script>
const modules=[
{title:"Backlink audit",questions:[
["A Delhi clinic receives offers from four sites. Which deserves first priority?","Choose the strongest editorial opportunity.",["A medical association’s patient resources page","A high-DA unrelated casino blog","A network selling 500 links","A generic comment section"],0,"Relevance, credibility and editorial placement matter more than a domain score or link quantity."],
["A real industry blog links to your case study inside an article. A directory has higher DR. Which matters most?","Compare context and relevance.",["Always choose higher DR","Evaluate the editorial link and audience first","Reject every directory link"],1,"DR is a third-party metric. A credible, relevant editorial link may offer greater value."],
["An agency pays for a placement in an industry newsletter. Which attribute is appropriate?","Consider an HTML link within a paid placement.",["rel=ugc","No rel attribute","rel=sponsored"],2,"Sponsored marks paid placements. It is appropriate even when the newsletter is relevant."],
["A forum member shares a useful resource in a discussion.","Which link attribute describes user-generated content?",["rel=ugc","rel=sponsored","rel=canonical"],0,"UGC identifies links in user-generated content. A publisher may also use nofollow."]]},
{title:"Anchor text & link spam",questions:[
["Identify the exact-match anchor.","Target keyword: SEO services in Delhi.",["King Digital","SEO services in Delhi","Learn more"],1,"An exact-match anchor repeats the target keyword verbatim."],
["A vendor guarantees 100 links with your exact target keyword. What should you do?","Evaluate the proposed campaign.",["Buy the links","Ask for twice as many","Decline and pursue genuine coverage"],2,"Manufactured exact-match links can constitute link spam. Natural references vary."],
["An independent blogger mentions your brand without a hyperlink.","What type of opportunity is this?",["Unlinked brand mention","Broken link building","Paid placement"],0,"A polite request for a relevant reference may turn a brand mention into a backlink."]]},
{title:"Link-building decisions",questions:[
["A relevant publication has an outdated broken link to a pricing guide.","Your agency has a useful current guide. What next?",["Send a personal note explaining the broken link and replacement","Mass-email every website","Demand an exact-match anchor"],0,"A relevant replacement and personalized outreach offer genuine value to the publisher."],
["Your client wants an asset that other websites may reference.","Pick the strongest starting point.",["Copied generic article","Original website cost calculator with clear methodology","A page stuffed with city names"],1,"A useful, original tool gives readers and publishers a reason to reference it."],
["A competitor appears in a respected industry association directory.","What is your next step?",["Copy every competitor backlink","Buy a listing regardless of eligibility","Check eligibility and genuine audience relevance"],2,"Competitor research reveals possible opportunities. Each needs independent evaluation."]]},
{title:"Local reputation",questions:[
["A clinic has different phone numbers on directories and its own website.","What should you prioritize?",["Correct inaccurate business details","Create more duplicate listings","Change every listing to a keyword-rich business name"],0,"Consistent accurate name, address and phone details help customers identify a business."],
["A client asks staff to post fake patient reviews.","Choose a sustainable approach.",["Use multiple accounts","Request honest reviews from actual patients","Buy five-star reviews"],1,"Genuine reviews protect credibility and support local visibility."],
["A post gains 2,000 likes but earns no clicks or mentions.","What can you conclude?",["Google must rank the page higher","Each like counts as a backlink","It achieved engagement; ranking impact remains unproven"],2,"Social engagement can support discovery, but likes are not established direct organic ranking factors."]]},
{title:"Campaign & measurement",questions:[
["Client brief: Delhi web agency, 30 days, limited budget.","Which first-week plan is strongest?",["Audit existing links, competitors and relevant prospects","Purchase a bulk backlink package","Publish unrelated guest posts"],0,"Research establishes a baseline and identifies feasible relevant opportunities."],
["The client gains 200 links from a single site. What metric changes by one?","Assume the site never previously linked to the client.",["Total backlinks","Unique referring domains","Organic conversions"],1,"Referring domains count unique linking websites, while backlinks count individual links."],
["A campaign earns five relevant referring domains and 80 referral visits, but rankings stay flat.","Which report is accurate?",["The campaign failed completely","Rankings will definitely improve next week","Report earned links and visits; monitor search and conversions over time"],2,"Campaign results include referrals, coverage and conversions. Rankings depend on many factors."],
["Which tools fit a low-budget reporting workflow?","Track search visibility, reported links and referral conversions.",["Google Search Console and GA4","Only a DA checker","Only Instagram analytics"],0,"Search Console reports search performance and links; GA4 measures acquisition and conversions."]]}
];const key="offpage-lab-v1";let answers={},section=0,index=0;try{answers=JSON.parse(localStorage.getItem(key)||"{}")}catch{}const all=modules.flatMap(m=>m.questions),el=id=>document.getElementById(id);function save(){try{localStorage.setItem(key,JSON.stringify(answers))}catch{}}function escapeText(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function render(){let done=Object.keys(answers).length,correct=modules.reduce((n,m,i)=>n+m.questions.filter((q,j)=>answers[i+"-"+j]===q[3]).length,0);el("score").textContent=correct+" / "+all.length;el("progress").style.width=100*done/all.length+"%";el("nav").innerHTML=modules.map((m,i)=>'<button class="'+(section===i?'active':'')+'" data-section="'+i+'">'+(i+1)+'. '+m.title+'<br><span style="font-size:12px">'+m.questions.filter((q,j)=>answers[i+"-"+j]!==undefined).length+'/'+m.questions.length+' completed</span></button>').join("")+'<button data-section="5" class="'+(section===5?'active':'')+'">Campaign worksheet</button><button data-section="6" class="'+(section===6?'active':'')+'">Results</button>';if(section===5){worksheet();return}if(section===6){el("lab").innerHTML='<div class="tag">Performance report</div><h2>'+correct+' correct out of '+all.length+'</h2><p>'+done+' attempted · '+(done?Math.round(correct/done*100):0)+'% accuracy</p><table><tr><th>Module</th><th>Correct</th></tr>'+modules.map((m,i)=>'<tr><td>'+m.title+'</td><td>'+m.questions.filter((q,j)=>answers[i+"-"+j]===q[3]).length+' / '+m.questions.length+'</td></tr>').join("")+'</table><p>Revisit each module to review explanations. Reset to attempt a fresh assessment.</p>';return}let m=modules[section],q=m.questions[index],k=section+"-"+index,a=answers[k],answered=a!==undefined;el("lab").innerHTML='<div class="row"><span class="tag">'+m.title+'</span><span>Question '+(index+1)+' of '+m.questions.length+'</span></div><h2>'+q[0]+'</h2><p class="context">'+q[1]+'</p><div class="choices">'+q[2].map((v,i)=>'<button data-choice="'+i+'" '+(answered?'disabled':'')+' class="'+(answered?(i===q[3]?'correct':i===a?'wrong':''):'')+'">'+escapeText(v)+'</button>').join("")+'</div>'+(answered?'<div class="feedback"><strong>'+(a===q[3]?'Correct':'Review this concept')+'</strong><br>'+q[4]+'</div>':'<p>Choose an answer to reveal feedback.</p>')+'<div class="row"><button id="prev" '+(!index?'disabled':'')+'>Previous</button><button id="next" class="primary">'+(index===m.questions.length-1?'Next module':'Next question')+'</button></div><footer>All scenarios use fictional client data. Scores measure learning, not Google ranking predictions.</footer>'}function worksheet(){let v={};try{v=JSON.parse(localStorage.getItem("offpage-worksheet")||"{}")}catch{}const fields=[["prospects","Three relevant prospect types"],["asset","Linkable asset and its audience"],["pitch","Draft a personalized outreach email"],["metrics","Baseline and success metrics"]];el("lab").innerHTML='<div class="tag">Applied exercise</div><h2>Plan a 30-day campaign</h2><p class="context">Client: a Delhi web development agency. Target page: web development services. Budget: limited. Goal: relevant coverage and qualified visits.</p>'+fields.map(([id,label])=>'<p><label for="'+id+'"><strong>'+label+'</strong></label><textarea id="'+id+'" rows="4">'+escapeText(v[id]||"")+'</textarea></p>').join("")+'<button class="primary" id="model">Compare with sample plan</button><div id="sample"></div><footer>Worksheet answers are saved on this device. This open-ended exercise is self-assessed.</footer>';fields.forEach(([id])=>el(id).oninput=()=>{v[id]=el(id).value;try{localStorage.setItem("offpage-worksheet",JSON.stringify(v))}catch{}});el("model").onclick=()=>el("sample").innerHTML='<div class="feedback"><strong>Sample plan</strong><p>Week 1: audit links and shortlist local business associations, technology publications and relevant partner resource pages. Week 2: create an original website pricing calculator and documented case study. Week 3: send personalized pitches explaining why the calculator benefits each publication’s readers. Week 4: compare referring domains, relevant placements, referral visits, leads and search performance against baseline.</p><p>Self-check: Is each prospect relevant? Is the asset original? Does the pitch offer reader value? Are outcomes measurable?</p></div>'}
document.addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.section!==undefined){section=+b.dataset.section;index=0;render()}else if(b.dataset.choice!==undefined){let k=section+"-"+index;if(answers[k]===undefined){answers[k]=+b.dataset.choice;save();render()}}else if(b.id==="next"){if(index<modules[section].questions.length-1)index++;else{section++;index=0}render()}else if(b.id==="prev"){index--;render()}else if(b.id==="reset"&&confirm("Reset all quiz answers and worksheet?")){answers={};save();try{localStorage.removeItem("offpage-worksheet")}catch{}section=0;index=0;render()}});render();
</script></html>
